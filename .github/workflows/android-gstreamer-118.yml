name: Android APK - GStreamer 1.18

on:
  workflow_dispatch:
    inputs:
      gstreamer_version:
        description: "GStreamer version"
        required: true
        default: "1.18.6"
        type: string
  push:
    branches:
      - Stable_V5.0
      - "Stable*"
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      QT_VERSION: 6.8.3
      GSTREAMER_VERSION: ${{ inputs.gstreamer_version || '1.18.6' }}
      QT_ANDROID_ABIS: "armeabi-v7a;arm64-v8a"

      # 如果你配置了签名 secret，会尝试签名；否则构建未签名 APK
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/deploy/android/android_release.keystore
      QT_ANDROID_KEYSTORE_ALIAS: QGCAndroidKeyStore
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch tags for version
        run: git fetch --all --tags -f --depth 1

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ env.QT_VERSION }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          ${{ env.QT_ROOT_DIR }}/bin/qt-cmake \
            -S ${{ github.workspace }} \
            -B . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }} \
            -DCMAKE_WARN_DEPRECATED=FALSE \
            -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64" \
            -DQT_ANDROID_SIGN_APK=${{ env.QT_ANDROID_KEYSTORE_STORE_PASS != '' && 'ON' || 'OFF' }} \
            -DQGC_STABLE_BUILD=ON \
            -DGStreamer_FIND_VERSION="${{ env.GSTREAMER_VERSION }}"

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --target all --config ${{ matrix.BuildType }}
          mkdir -p artifacts
          find . -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-Android-GStreamer-${{ env.GSTREAMER_VERSION }}
          path: ${{ runner.temp }}/shadow_build_dir/artifacts/*.apk
